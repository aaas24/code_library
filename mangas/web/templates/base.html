<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Manga Tracker{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
           background: #0f0f0f; color: #e0e0e0; min-height: 100vh; }
    a { color: #7eb8f7; text-decoration: none; }
    a:hover { text-decoration: underline; }
    nav { background: #1a1a2e; padding: 0.75rem 1rem; display: flex; gap: 1rem;
          flex-wrap: wrap; border-bottom: 1px solid #2a2a4a; }
    nav a { font-weight: 600; font-size: 0.95rem; padding: 0.3rem 0.6rem;
             border-radius: 4px; }
    nav a:hover { background: #2a2a4a; }
    .container { max-width: 900px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.4rem; margin-bottom: 1rem; color: #a0c4ff; }
    h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #c8d8f0; }
    .card { background: #1a1a2e; border-radius: 8px; padding: 1rem;
            margin-bottom: 0.75rem; border: 1px solid #2a2a4a; }
    .badge { display: inline-block; background: #2a5298; color: #fff;
             border-radius: 12px; padding: 0.15rem 0.6rem; font-size: 0.78rem;
             font-weight: 700; }
    .badge-green { background: #1a7a3a; }
    .badge-orange { background: #7a4a1a; }
    .btn { display: inline-block; padding: 0.4rem 1rem; border-radius: 6px;
           font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none;
           background: #2a5298; color: #fff; }
    .btn:hover { background: #3a62a8; }
    .btn-small { padding: 0.25rem 0.6rem; font-size: 0.8rem; }
    .btn-danger { background: #7a1a1a; }
    .btn-danger:hover { background: #8a2a2a; }
    .btn-muted { background: #2a2a4a; color: #aaa; }
    .btn-muted:hover { background: #3a3a5a; color: #e0e0e0; }
    .btn-success { background: #1a6a2a; }
    .btn-success:hover { background: #2a7a3a; }
    .meta { color: #888; font-size: 0.82rem; margin-top: 0.3rem; }
    .tag { display: inline-block; background: #2a3a2e; color: #8fd4a8;
           border-radius: 10px; padding: 0.1rem 0.5rem; font-size: 0.75rem;
           margin-right: 0.2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 0.5rem 0.75rem;
             border-bottom: 1px solid #2a2a4a; font-size: 0.88rem; }
    th { color: #a0c4ff; font-weight: 600; }
    .empty { color: #666; text-align: center; padding: 2rem; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  <nav>
    <a href="/home">Home</a>
    <a href="/updates">Updates</a>
    <a href="/active">All Active</a>
    <a href="/bugs">Bugs</a>
    <a href="/recommendations">Recommendations</a>
    <a href="/settings">Settings</a>
  </nav>
  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div style="margin-bottom:0.75rem;">
      {% for category, message in messages %}
      <div style="padding:0.5rem 0.75rem; border-radius:6px; font-size:0.87rem; margin-bottom:0.3rem;
                  background:{% if category == 'error' %}#3a1a1a{% elif category == 'warning' %}#3a2a0a{% else %}#0a2a1a{% endif %};
                  border:1px solid {% if category == 'error' %}#7a1a1a{% elif category == 'warning' %}#7a4a0a{% else %}#1a7a3a{% endif %};
                  color:{% if category == 'error' %}#f09090{% elif category == 'warning' %}#f0c070{% else %}#90f0b0{% endif %};">
        {{ message }}
      </div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
