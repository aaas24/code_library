# This file references an EXTERNAL secret store — it never stores values directly.
# Values are injected at deploy time via the 1Password operator or CI/CD pipeline.
apiVersion: v1
kind: Secret
metadata:
  name: manga-tracker-secrets
type: Opaque
# stringData values are populated by CI/CD from 1Password at deploy time.
# DO NOT commit real values here.
stringData:
  op-service-account-token: "INJECTED_AT_DEPLOY_TIME"
