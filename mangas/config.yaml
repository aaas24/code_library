schedules:
  chapter_check: "0 2 * * *"        # daily at 2am
  recommendations: "0 3 * * 1"      # weekly Monday at 3am

sites:
  coffeemanga:
    scraper: true
    crawler: true
    domains:
      - coffeemanga.io
      - coffeemanga.ink
      - coffeemanga.moe
  shibamanga:
    scraper: true
    crawler: true
    domains:
      - shibamanga.com
  kaliscan:
    scraper: true
    crawler: true
    domains:
      - kaliscan.io
  manhuascan:
    scraper: false   # disabled: site has unsafe trackers
    crawler: false
    domains:
      - manhuascan.com

themes:
  # villainess / isekai tropes
  - villainess
  - villainous
  - reincarnation
  - reincarnated
  - isekai
  - transmigrat
  # historical / nobility
  - emperor
  - empress
  - duke
  - duchess
  - marquis
  - countess
  - noble
  - royalty
  - kingdom
  - palace
  - aristocrat
  # female lead archetypes
  - lady
  - princess
  - saintess
  # healing / medical
  - healer
  - healing
  - doctor
  - physician
  - apothecary

recommendations:
  min_chapters: 100
  max_pages: 5        # guardrail: max pages to crawl per site per session

web:
  port: 5000
  host: "0.0.0.0"
