name: Tests

on:
  push:
  pull_request:
  workflow_call:   # allows manga-deploy.yml to call this as a reusable workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r mangas/requirements.txt

      - name: Run tests
        working-directory: mangas
        run: pytest tests/ -v --tb=short
