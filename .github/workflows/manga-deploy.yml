name: Deploy to Pi

on:
  push:
    branches: [main]

jobs:
  test:
    uses: ./.github/workflows/manga-test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v1

      - name: Fetch Pi credentials from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          PI_HOST=$(op read "op://Homelab/Manga - Homelab Server/pi_host")
          PI_USER=$(op read "op://Homelab/Manga - Homelab Server/pi_user")
          echo "PI_HOST=$PI_HOST" >> $GITHUB_ENV
          echo "PI_USER=$PI_USER" >> $GITHUB_ENV

      - name: Debug - check PI_HOST is set
        run: |
          echo "PI_HOST is: '$PI_HOST'"
          echo "PI_USER is: '$PI_USER'"

      - name: Fetch SSH key from 1Password
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          op read "op://Homelab/Manga - Homelab Server/github_deploy_key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "SSH key written, size: $(wc -c < ~/.ssh/deploy_key) bytes"

      - name: Add Pi to known hosts
        run: |
          echo "Scanning $PI_HOST..."
          ssh-keyscan -H "$PI_HOST" >> ~/.ssh/known_hosts
          echo "known_hosts has $(wc -l < ~/.ssh/known_hosts) entries"

      - name: Set up QEMU (for ARM64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 image
        uses: docker/build-push-action@v5
        with:
          context: ./mangas
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/manga-tracker:latest

      - name: Bootstrap Pi (idempotent — safe to run on every deploy)
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            $PI_USER@$PI_HOST << 'ENDSSH'
            set -e

            # Install Docker if not present
            if ! command -v docker &> /dev/null; then
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
              newgrp docker
            fi

            # Install Docker Compose plugin if not present
            if ! docker compose version &> /dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq docker-compose-plugin
            fi

            # Install 1Password CLI if not present
            if ! command -v op &> /dev/null; then
              curl -sS https://downloads.1password.com/linux/keys/1password.asc | \
                sudo gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
              echo 'deb [arch=arm64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/arm64 stable main' | \
                sudo tee /etc/apt/sources.list.d/1password.list
              sudo apt-get update -qq
              sudo apt-get install -y -qq 1password-cli
            fi

            # Create app directory
            mkdir -p ~/manga-tracker/data

            # Write docker-compose.yml if not present
            if [ ! -f ~/manga-tracker/docker-compose.yml ]; then
              cat > ~/manga-tracker/docker-compose.yml << 'COMPOSE'
            version: "3.9"
            services:
              manga-tracker:
                image: ghcr.io/aaas24/manga-tracker:latest
                restart: always
                ports:
                  - "5000:5000"
                volumes:
                  - ./data:/app/data
                environment:
                  - OP_SERVICE_ACCOUNT_TOKEN=${OP_SERVICE_ACCOUNT_TOKEN}
            COMPOSE
            fi
          ENDSSH

      - name: Deploy to Pi
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          ssh -i ~/.ssh/deploy_key $PI_USER@$PI_HOST \
            "cd ~/manga-tracker && \
             OP_SERVICE_ACCOUNT_TOKEN='${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}' \
             docker compose pull && \
             docker compose up -d && \
             docker compose ps"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key $PI_USER@$PI_HOST \
            "curl -sf http://localhost:5000/ && echo 'App is healthy'"
